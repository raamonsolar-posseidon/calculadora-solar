<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Calculadora Solar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f0f0; }
        .container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px; text-align: center; }
        .header h1 { font-size: 20px; margin-bottom: 4px; }
        .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 8px; gap: 8px; }
        .canvas-section { flex: 1; background: white; border-radius: 8px; border: 2px solid #ddd; overflow: hidden; display: flex; flex-direction: column; }
        .canvas-container { flex: 1; display: flex; align-items: center; justify-content: center; background: white; overflow: hidden; }
        canvas { max-width: 100%; max-height: 100%; display: block; }
        .controls { background: white; padding: 8px; border-top: 1px solid #ddd; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .control-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        input[type="file"], input[type="number"], select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; min-width: 100px; }
        .info-section { background: white; border-radius: 8px; padding: 12px; border: 2px solid #ddd; max-height: 35vh; overflow-y: auto; }
        .info-item { margin-bottom: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #667eea; border-radius: 4px; }
        .info-label { font-size: 11px; color: #667eea; font-weight: bold; margin-bottom: 4px; }
        .info-value { font-size: 18px; font-weight: bold; color: #333; }
        .button-group { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
        button { background: #667eea; color: white; border: none; border-radius: 4px; padding: 10px 14px; font-size: 12px; font-weight: bold; cursor: pointer; flex: 1; min-width: 100px; }
        button:active { background: #764ba2; }
        button.danger { background: #ff6b6b; }
        .status-message { background: #e3f2fd; border-left: 3px solid #2196f3; padding: 8px; border-radius: 4px; font-size: 12px; color: #1565c0; margin-bottom: 8px; }
        @media (min-width: 768px) { .content { flex-direction: row; } .canvas-section { flex: 2; } .info-section { flex: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>☀️ Calculadora Solar</h1>
            <p>Diseño de paneles solares</p>
        </div>
        <div class="content">
            <div class="canvas-section">
                <div class="canvas-container">
                    <canvas id="canvas"></canvas>
                </div>
                <div class="controls">
                    <div class="control-item">
                        <label>Foto:</label>
                        <input type="file" id="imageInput" accept="image/*">
                    </div>
                    <div class="control-item">
                        <label>Ref (m):</label>
                        <input type="number" id="referenceInput" placeholder="Metros" step="0.1" min="0.1">
                    </div>
                </div>
            </div>
            <div class="info-section">
                <div class="status-message">📱 Toca para marcar la medida</div>
                <div class="info-item">
                    <div class="info-label">Zonas</div>
                    <div class="info-value" id="zonesDisplay">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Paneles</div>
                    <div class="info-value" id="panelsDisplay">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">Potencia</div>
                    <div class="info-value" id="powerDisplay">0 kW</div>
                </div>
                <div class="button-group">
                    <button onclick="addZone()">+ Zona</button>
                    <button onclick="clearAll()" class="danger">Limpiar</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let image = null, zones = [], calibrationPoint1 = null, calibrationPoint2 = null;
        let referenceLength = 0, pixelsPerMeter = 0;
        const PANEL_WIDTH = 2.4, PANEL_HEIGHT = 1.3, PANEL_POWER = 700;

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            redraw();
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                image = new Image();
                image.onload = function() {
                    zones = []; calibrationPoint1 = null; calibrationPoint2 = null;
                    referenceLength = 0; pixelsPerMeter = 0;
                    resizeCanvas();
                };
                image.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('referenceInput').addEventListener('change', function(e) {
            referenceLength = parseFloat(e.target.value) || 0;
            if (calibrationPoint1 && calibrationPoint2 && referenceLength > 0) {
                const distance = Math.hypot(calibrationPoint2.x - calibrationPoint1.x, calibrationPoint2.y - calibrationPoint1.y);
                pixelsPerMeter = distance / referenceLength;
                redraw();
            }
        });

        canvas.addEventListener('touchstart', handleInput, false);
        canvas.addEventListener('mousedown', handleInput, false);

        function handleInput(e) {
            if (e.type.startsWith('touch')) e.preventDefault();
            if (!image) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY) - rect.top;
            if (!calibrationPoint1) calibrationPoint1 = {x, y};
            else if (!calibrationPoint2) calibrationPoint2 = {x, y};
            redraw();
        }

        function addZone() {
            if (!pixelsPerMeter) { alert('Calibra primero'); return; }
            zones.push({id: Date.now(), horizontal: 4, vertical: 3});
            updateReport();
        }

        function clearAll() {
            if (confirm('¿Limpiar?')) {
                zones = []; calibrationPoint1 = null; calibrationPoint2 = null;
                referenceLength = 0; pixelsPerMeter = 0;
                document.getElementById('referenceInput').value = '';
                updateReport(); redraw();
            }
        }

        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (image) {
                const scale = Math.min(canvas.width / image.width, canvas.height / image.height);
                const x = (canvas.width - image.width * scale) / 2;
                const y = (canvas.height - image.height * scale) / 2;
                ctx.drawImage(image, x, y, image.width * scale, image.height * scale);
            }
            if (calibrationPoint1) {
                ctx.fillStyle = '#00bfff';
                ctx.beginPath(); ctx.arc(calibrationPoint1.x, calibrationPoint1.y, 8, 0, Math.PI * 2);
                ctx.fill();
                if (calibrationPoint2) {
                    ctx.strokeStyle = '#00bfff'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(calibrationPoint1.x, calibrationPoint1.y);
                    ctx.lineTo(calibrationPoint2.x, calibrationPoint2.y); ctx.stroke();
                    ctx.fillStyle = '#00bfff'; ctx.beginPath();
                    ctx.arc(calibrationPoint2.x, calibrationPoint2.y, 8, 0, Math.PI * 2); ctx.fill();
                }
            }
        }

        function updateReport() {
            let totalPanels = 0;
            zones.forEach(z => totalPanels += z.horizontal * z.vertical);
            const power = (totalPanels * PANEL_POWER) / 1000;
            document.getElementById('zonesDisplay').textContent = zones.length;
            document.getElementById('panelsDisplay').textContent = totalPanels;
            document.getElementById('powerDisplay').textContent = power.toFixed(2) + ' kW';
        }
        updateReport();
    </script>
</body>
</html>
