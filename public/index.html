<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Calculadora Solar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
        html, body { width: 100%; height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f0f0; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px; text-align: center; }
        .header h1 { font-size: 20px; margin-bottom: 4px; }
        .content { flex: 1; overflow-y: auto; padding: 10px; }
        .section { background: white; border-radius: 8px; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; }
        .section h2 { font-size: 14px; color: #667eea; margin-bottom: 10px; font-weight: bold; }
        .canvas-box { border: 2px solid #ddd; border-radius: 6px; overflow: hidden; margin-bottom: 10px; height: 300px; display: flex; align-items: center; justify-content: center; background: #f9f9f9; }
        canvas { max-width: 100%; max-height: 100%; display: block; }
        .input-group { margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
        .input-group label { font-size: 12px; font-weight: bold; min-width: 70px; }
        .input-group input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        .input-group button { padding: 8px 12px; background: #667eea; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .input-group button:active { background: #764ba2; }
        .info-box { background: #e3f2fd; border-left: 3px solid #2196f3; padding: 10px; border-radius: 4px; font-size: 12px; color: #1565c0; margin-bottom: 10px; }
        .step-indicator { background: #f0f0f0; padding: 10px; border-radius: 4px; margin-bottom: 10px; text-align: center; font-size: 13px; font-weight: bold; color: #667eea; }
        .button-group { display: flex; gap: 8px; }
        button { padding: 10px; background: #667eea; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; flex: 1; font-size: 12px; }
        button:active { background: #764ba2; }
        button.danger { background: #ff6b6b; }
        button.danger:active { background: #ff5252; }
        .hidden { display: none; }
        .stat { padding: 10px; background: #f9f9f9; border-left: 3px solid #667eea; border-radius: 4px; margin-bottom: 8px; }
        .stat-label { font-size: 11px; color: #667eea; font-weight: bold; }
        .stat-value { font-size: 18px; font-weight: bold; color: #333; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>☀️ Calculadora Solar</h1>
            <p>Diseño de paneles solares</p>
        </div>

        <div class="content">
            <!-- PASO 1: CARGAR FOTO -->
            <div class="section" id="step1">
                <h2>Paso 1: Carga tu foto</h2>
                <div class="input-group">
                    <label>Foto:</label>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
            </div>

            <!-- PASO 2: CALIBRACIÓN -->
            <div class="section" id="step2" class="hidden">
                <h2>Paso 2: Calibración</h2>
                <div class="info-box">Toca 2 puntos en la foto para marcar una medida conocida</div>
                
                <div class="canvas-box">
                    <canvas id="canvas"></canvas>
                </div>

                <div class="input-group">
                    <label>Distancia (m):</label>
                    <input type="number" id="referenceLength" placeholder="Ej: 10" step="0.1" min="0.1">
                    <button onclick="confirmCalibration()">✓ OK</button>
                </div>
            </div>

            <!-- PASO 3: CREAR ZONAS -->
            <div class="section" id="step3" class="hidden">
                <h2>Paso 3: Crear zonas</h2>
                <div class="info-box">Toca para marcar puntos y crear zonas de paneles</div>
                
                <div class="canvas-box">
                    <canvas id="canvas2"></canvas>
                </div>

                <div class="button-group">
                    <button onclick="addZone()">+ Zona</button>
                    <button onclick="backToCalibration()" class="danger">Volver</button>
                </div>
            </div>

            <!-- RESULTADOS -->
            <div class="section" id="results" class="hidden">
                <h2>📊 Resultados</h2>
                <div class="stat">
                    <div class="stat-label">Zonas creadas</div>
                    <div class="stat-value" id="zonesCount">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Paneles</div>
                    <div class="stat-value" id="panelsCount">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Potencia total</div>
                    <div class="stat-value" id="powerTotal">0 kW</div>
                </div>
                <button onclick="resetAll()" class="danger">Empezar de nuevo</button>
            </div>
        </div>
    </div>

    <script>
        let image = null, zones = [];
        let calibrationPoint1 = null, calibrationPoint2 = null;
        let referenceLength = 0, pixelsPerMeter = 0;
        let currentStep = 1;

        const PANEL_POWER = 700;

        // Cargar imagen
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                image = new Image();
                image.onload = function() {
                    goToStep(2);
                    drawCalibration();
                };
                image.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Eventos del canvas de calibración
        document.addEventListener('click', function(e) {
            if (currentStep !== 2) return;
            const canvas = document.getElementById('canvas');
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (x < 0 || x > canvas.width || y < 0 || y > canvas.height) return;
            
            if (!calibrationPoint1) calibrationPoint1 = {x, y};
            else if (!calibrationPoint2) calibrationPoint2 = {x, y};
            
            drawCalibration();
        });

        function drawCalibration() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (image) {
                const scale = Math.min(canvas.width / image.width, canvas.height / image.height);
                const x = (canvas.width - image.width * scale) / 2;
                const y = (canvas.height - image.height * scale) / 2;
                ctx.drawImage(image, x, y, image.width * scale, image.height * scale);
            }
            
            if (calibrationPoint1) {
                ctx.fillStyle = '#00bfff';
                ctx.beginPath();
                ctx.arc(calibrationPoint1.x, calibrationPoint1.y, 8, 0, Math.PI * 2);
                ctx.fill();
                
                if (calibrationPoint2) {
                    ctx.strokeStyle = '#00bfff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(calibrationPoint1.x, calibrationPoint1.y);
                    ctx.lineTo(calibrationPoint2.x, calibrationPoint2.y);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.arc(calibrationPoint2.x, calibrationPoint2.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function confirmCalibration() {
            if (!calibrationPoint1 || !calibrationPoint2) {
                alert('Marca 2 puntos en la foto');
                return;
            }
            referenceLength = parseFloat(document.getElementById('referenceLength').value);
            if (!referenceLength || referenceLength <= 0) {
                alert('Ingresa la distancia en metros');
                return;
            }
            
            const distance = Math.hypot(
                calibrationPoint2.x - calibrationPoint1.x,
                calibrationPoint2.y - calibrationPoint1.y
            );
            pixelsPerMeter = distance / referenceLength;
            
            goToStep(3);
        }

        function addZone() {
            zones.push({id: Date.now(), panels: 12});
            updateResults();
        }

        function backToCalibration() {
            if (confirm('Volver a calibración?')) {
                zones = [];
                calibrationPoint1 = null;
                calibrationPoint2 = null;
                referenceLength = 0;
                pixelsPerMeter = 0;
                goToStep(2);
                drawCalibration();
            }
        }

        function resetAll() {
            zones = [];
            calibrationPoint1 = null;
            calibrationPoint2 = null;
            referenceLength = 0;
            pixelsPerMeter = 0;
            image = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('referenceLength').value = '';
            goToStep(1);
        }

        function goToStep(step) {
            currentStep = step;
            document.getElementById('step1').classList.toggle('hidden', step !== 1);
            document.getElementById('step2').classList.toggle('hidden', step !== 2);
            document.getElementById('step3').classList.toggle('hidden', step !== 3);
            document.getElementById('results').classList.toggle('hidden', step !== 4);
            
            if (step === 3 && zones.length > 0) {
                goToStep(4);
            }
        }

        function updateResults() {
            let totalPanels = 0;
            zones.forEach(z => totalPanels += z.panels);
            
            document.getElementById('zonesCount').textContent = zones.length;
            document.getElementById('panelsCount').textContent = totalPanels;
            document.getElementById('powerTotal').textContent = ((totalPanels * PANEL_POWER) / 1000).toFixed(2) + ' kW';
            
            if (zones.length > 0) {
                goToStep(4);
            }
        }
    </script>
</body>
</html>
